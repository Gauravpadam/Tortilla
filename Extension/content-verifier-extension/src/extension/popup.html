<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Verifier</title>
  <style>
    body {
      width: 350px;
      min-height: 400px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
    }

    .header {
      background: linear-gradient(135deg, #007bff, #0056b3);
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 0 0 15px 15px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .header .subtitle {
      margin: 5px 0 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .content {
      padding: 0 20px 20px;
    }

    .status-section {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .status-section h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #212529;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #6c757d;
    }

    .status-dot.active {
      background: #28a745;
    }

    .status-dot.processing {
      background: #ffc107;
      animation: pulse 2s infinite;
    }

    .status-dot.error {
      background: #dc3545;
    }

    .status-text {
      font-size: 14px;
      color: #6c757d;
    }

    .current-page {
      background: #e9ecef;
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
      color: #495057;
      word-break: break-all;
      margin-bottom: 10px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .stat-item {
      text-align: center;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 6px;
    }

    .stat-number {
      font-size: 18px;
      font-weight: 600;
      color: #007bff;
      display: block;
    }

    .stat-label {
      font-size: 12px;
      color: #6c757d;
      margin-top: 2px;
    }

    .settings-section {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .setting-item:last-child {
      margin-bottom: 0;
    }

    .setting-label {
      font-size: 14px;
      color: #212529;
    }

    .toggle-switch {
      position: relative;
      width: 50px;
      height: 24px;
      background: #ccc;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .toggle-switch.active {
      background: #007bff;
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }

    .toggle-switch.active::after {
      transform: translateX(26px);
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #007bff;
      color: white;
    }

    .btn-primary:hover {
      background: #0056b3;
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .btn-secondary:hover {
      background: #545b62;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background: #c82333;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .footer {
      text-align: center;
      padding: 15px 20px;
      font-size: 12px;
      color: #6c757d;
      border-top: 1px solid #dee2e6;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔍 Content Verifier</h1>
    <p class="subtitle">AI-powered content verification</p>
  </div>

  <div class="content">
    <div class="status-section">
      <h3>Current Status</h3>
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Initializing...</span>
      </div>
      <div class="current-page" id="currentPage">No page loaded</div>
      
      <div class="stats">
        <div class="stat-item">
          <span class="stat-number" id="claimsCount">0</span>
          <span class="stat-label">Claims Found</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="verificationCount">0</span>
          <span class="stat-label">Verified</span>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <h3>Settings</h3>
      <div class="setting-item">
        <span class="setting-label">Auto-verify content</span>
        <div class="toggle-switch" id="autoVerifyToggle"></div>
      </div>
      <div class="setting-item">
        <span class="setting-label">Show verification badges</span>
        <div class="toggle-switch" id="showBadgesToggle"></div>
      </div>
      <div class="setting-item">
        <span class="setting-label">Show sidebar</span>
        <div class="toggle-switch" id="showSidebarToggle"></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="verifyBtn">Verify Now</button>
      <button class="btn btn-secondary" id="refreshBtn">Refresh</button>
    </div>

    <div class="actions">
      <button class="btn btn-danger" id="clearBtn">Clear Data</button>
    </div>
  </div>

  <div class="footer">
    <p>Content Verifier v1.0.0</p>
    <p>Making the web more trustworthy</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
